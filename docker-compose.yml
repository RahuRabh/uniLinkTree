# version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: sync
          path: ./frontend
          target: /app

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env 
    develop:
      watch:
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
        - action: sync
          path: ./backend
          target: /app
