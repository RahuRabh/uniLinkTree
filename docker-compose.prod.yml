version: "3.9"
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  
    depends_on:
      - frontend
      - backend
  frontend:
    image: ralkum/unilink-frontend:latest
    expose:
      - "80"

  backend:
    image: ralkum/unilink-backend:latest
    expose:
      - "8000"
    env_file:
      - .env
