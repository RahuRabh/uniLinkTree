version: "3.9"
services:
  backend:
    image: ralkum/unilink-backend:latest
    platform: linux/amd64
    expose:
      - "8000"
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro  
    depends_on:
      - backend:
    restart: always
